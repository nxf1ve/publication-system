spring:
  application.name: publication-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/publication_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
server.port: ${SERVER_PORT:8080}
security.jwt.secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
security.jwt.expiration-ms: ${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include: health,info

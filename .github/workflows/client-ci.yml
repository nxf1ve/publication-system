name: Client CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Run linter when configured
        run: npm run lint --if-present

      - name: Run tests when configured
        run: npm test --if-present -- --coverage

      - name: Build client
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v7
        with:
          name: client-build
          path: client/dist
          if-no-files-found: error

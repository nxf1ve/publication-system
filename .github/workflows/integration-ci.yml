name: PostgreSQL integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: publication_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/publication_system_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -f server/pom.xml clean verify
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e:live
        working-directory: client
      - name: Upload integration JUnit and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-reports
          path: |
            server/target/surefire-reports
            server/target/site/jacoco
            client/playwright-live-report
            client/test-results/live*
          if-no-files-found: error
